modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# 必装前置：VanillaBackport（长矛核心）
[[dependencies.${mod_id}]]
    modId = "vanillabackport"
    type = "required"
    versionRange = "[1.2,)"
    ordering = "AFTER"
    side = "BOTH"

# 必装前置：Platform（VanillaBackport 的库依赖）
[[dependencies.${mod_id}]]
    modId = "platform"
    type = "required"
    versionRange = "[1.4,)"
    ordering = "AFTER"
    side = "BOTH"

# 可选前置：BetterEnd
[[dependencies.${mod_id}]]
    modId = "betterend"
    type = "optional"
    versionRange = "[0,)"
    ordering = "AFTER"
    side = "BOTH"

# 可选前置：Oreganized
[[dependencies.${mod_id}]]
    modId = "oreganized"
    type = "optional"
    versionRange = "[0,)"
    ordering = "AFTER"
    side = "BOTH"

# 可选前置：Caverns & Chasms
[[dependencies.${mod_id}]]
    modId = "caverns_and_chasms"
    type = "optional"
    versionRange = "[0,)"
    ordering = "AFTER"
    side = "BOTH"
