plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // 必装前置：VanillaBackport（长矛核心）与其依赖 Platform 库（官方 1.2 / 1.4 版本）。
    // 默认从 libs/ 读取前置 jar；也可以用 -Pdependency_dir=<目录> 指定其它目录。
    def dependencyDir = file(providers.gradleProperty('dependency_dir').orElse('libs').get())

    // 按文件名里的版本号挑出目录中最新的前置 jar，升级前置时无需再改构建脚本。
    def latestPrefixed = { String prefix, String label ->
        def candidates = (dependencyDir.listFiles() ?: []).findAll { it.isFile() && it.name.startsWith(prefix) }
        if (candidates.isEmpty()) {
            throw new GradleException(
                    "缺少前置 jar（${label}）。请自行下载 VanillaBackport >= 1.2 与 Platform >= 1.4，" +
                    "放到 libs/，或使用 -Pdependency_dir=<目录>。")
        }
        // VanillaBackport-neoforge-1.21.1-1.2.2.jar -> "1.2.2"，按数字逐段比较
        def versionKey = { File f ->
            def matcher = f.name =~ /-1\.21\.1-(\d+(?:\.\d+)*)\.jar$/
            matcher.find() ? matcher.group(1).tokenize('.').collect { it.padLeft(5, '0') }.join('.') : ''
        }
        candidates.sort { a, b -> versionKey(a) <=> versionKey(b) }.last()
    }

    def vbpJar = latestPrefixed('VanillaBackport-neoforge-1.21.1-', 'VanillaBackport')
    def platformJar = latestPrefixed('Platform-neoforge-1.21.1-', 'Platform')
    logger.lifecycle("[equipment-complement] dependencies: ${vbpJar.name} / ${platformJar.name}")

    compileOnly files(vbpJar, platformJar)
    localRuntime files(vbpJar, platformJar)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
